<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>계산기 | JavaScript 2일차</title>
    <!-- 계산기 화면(LCD)에 쓸 숫자 글꼴 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap">
    <link rel="stylesheet" href="calculator_style.css">
</head>
<body>
    <!-- 버튼마다 onclick을 쓰지 않고, calculator.js에서 querySelector로 찾아 addEventListener로 연결합니다. -->
    <main class="calculator" aria-label="계산기">
        <div class="screen">
            <!-- 직전 계산식 (예: 12 + 3 × 4 =) -->
            <p class="history" id="history" aria-live="polite"></p>
            <!-- 입력 중인 식과 결과를 보여주는 칸 (readonly: 키보드로 직접 고칠 수 없음) -->
            <input type="text" id="display" value="0" readonly aria-label="계산기 화면">
        </div>

        <div class="buttons">
            <button class="on-off" type="button" aria-pressed="true"><span class="led" aria-hidden="true"></span>ON/OFF</button>
            <button class="clear" type="button" aria-label="모두 지우기">C</button>
            <!-- data-value: 화면에는 ÷ 를 보여주고, 계산에는 / 를 쓰기 위한 값 -->
            <button class="operator" type="button" data-value="/" aria-label="나누기">÷</button>

            <button class="number" type="button">7</button>
            <button class="number" type="button">8</button>
            <button class="number" type="button">9</button>
            <button class="operator" type="button" data-value="*" aria-label="곱하기">×</button>

            <button class="number" type="button">4</button>
            <button class="number" type="button">5</button>
            <button class="number" type="button">6</button>
            <button class="operator" type="button" data-value="-" aria-label="빼기">−</button>

            <button class="number" type="button">1</button>
            <button class="number" type="button">2</button>
            <button class="number" type="button">3</button>
            <button class="operator" type="button" data-value="+" aria-label="더하기">+</button>

            <button class="number" type="button" aria-label="소수점">.</button>
            <button class="number" type="button">0</button>
            <button class="enter" type="button" aria-label="계산하기">Enter</button>
        </div>

        <p class="hint">키보드로도 입력할 수 있어요: 숫자, + - * /, Enter, Backspace, Esc</p>
    </main>

    <!-- body 맨 끝에서 JS를 불러와야 위의 버튼들이 다 만들어진 뒤에 querySelector로 찾을 수 있음 -->
    <script src="calculator.js"></script>
</body>
</html>
